name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-farm:latest
            ghcr.io/mynameis-nigel/ssh-farm:${{ steps.meta.outputs.sha_short }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      # This repo is private, so the image is private too — the host needs
      # a one-time `docker login ghcr.io` with a read:packages-scoped PAT
      # before `docker compose pull farm` will work non-interactively (see
      # ssh-arcadelobby/deploy/README.md). Same skip-cleanly pattern as the
      # router's own release.yml: until DEPLOY_HOST is set for the
      # production environment, this job succeeds as a no-op rather than
      # failing loudly on every merge.
      - name: Check deploy is configured
        id: check
        run: |
          if [ -z "${{ vars.DEPLOY_HOST }}" ]; then
            echo "::notice::DEPLOY_HOST not set for the production environment — skipping deploy. See ssh-arcadelobby/deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/ssharcade
            docker compose pull farm
            docker compose up -d farm

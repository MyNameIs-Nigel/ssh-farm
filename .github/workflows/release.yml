name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-farm:latest
            ghcr.io/mynameis-nigel/ssh-farm:${{ steps.meta.outputs.sha_short }}

  # There is no `deploy:` job any more.
  #
  # It ran `runs-on: [self-hosted, production]` — directly on the
  # play.ssharcade.dev host. A self-hosted runner is unsafe on a repo that is
  # going public: for `pull_request` events GitHub reads the workflow file
  # from the PR head, so anyone who can open a fork PR can point `runs-on:` at
  # the `self-hosted` label and execute their own code on the box — which is
  # in the docker group, and holds every player save. The runners were
  # deregistered and uninstalled on 2026-09-04, before any repo is flipped
  # public. Do not reinstate one here.
  #
  # Merging to `main` therefore builds and publishes the image but does not
  # ship it. Deploy by hand until the OIDC + SSM path replaces this:
  #
  #   ssh <host> && cd /srv/ssharcade
  #   docker compose pull farm && docker compose up -d farm
  #
  # See ../ssh-arcadelobby/deploy/README.md, "Deploying by hand".

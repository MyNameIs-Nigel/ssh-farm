name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mynameis-nigel/ssh-farm:latest
            ghcr.io/mynameis-nigel/ssh-farm:${{ steps.meta.outputs.sha_short }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # mint the OIDC token — the only credential this job holds
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Held in a repo variable rather than written inline: this repo is
          # public, and the ARN carries the AWS account ID. Not a secret, but
          # not something to publish for free either.
          role-to-assume: ${{ vars.ARCADE_DEPLOY_ROLE }}
          aws-region: us-east-1

      - name: Deploy farm via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.ARCADE_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy farm ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /srv/ssharcade",
              "docker compose pull farm",
              "docker compose up -d farm",
              "sleep 10",
              "docker compose ps --status running --quiet farm | grep -q ."
            ]' \
            --query Command.CommandId --output text)

          # `wait` exits non-zero when the remote command failed. Swallow that so
          # the invocation below still prints the real stdout/stderr — without the
          # `|| true` a failed deploy gives you an exit code and no logs.
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.ARCADE_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.ARCADE_INSTANCE_ID }}" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json | tee result.json

          test "$(jq -r .Status result.json)" = Success

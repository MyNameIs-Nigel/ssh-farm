name: Release

on:
  release:
    types: [published]

# Never interrupt an active SSM deployment. A host lock also serializes repos.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: python3 scripts/deploy/test_deploy.py
      - id: release
        name: Validate release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: release
    name: verify
    uses: ./.github/workflows/verify.yml
    with:
      # main is already gated by the pull-request run; this is the
      # belt-and-braces pass on the merge result itself.
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      test-count: 2
      build-image: false # publish below builds it for real

  publish:
    name: publish image
    needs: [release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          labels: |
            org.opencontainers.image.version=v${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          push: true
          # A layer cache turns a ~4 minute rebuild into well under a minute
          # for the common case where only Go source changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NOTICE already has to carry the bundled litestream binary's
          # Apache-2.0 attribution. An SBOM makes that list machine-checkable
          # instead of a thing someone remembers to update.
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/mynameis-nigel/ssh-farm:latest
            ghcr.io/mynameis-nigel/ssh-farm:${{ steps.meta.outputs.sha_short }}
            ghcr.io/mynameis-nigel/ssh-farm:v${{ steps.meta.outputs.version }}

      - name: attest provenance
        # The image is pulled anonymously by anyone who wants it. Signed
        # provenance lets a puller verify it came from this workflow, in this
        # repository, from this commit — rather than trusting the tag.
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/mynameis-nigel/ssh-farm
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: scan published image
        # Run the scanner's own image rather than an action: for a
        # vulnerability scanner you actively want the current database and
        # detection logic, so a floating tag is right here where it would
        # not be for an action that executes in the job's context.
        # --ignore-unfixed: an advisory with no fix available is not
        # something a red build helps with.
        run: |
          docker run --rm aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --format table \
            ghcr.io/mynameis-nigel/ssh-farm@${{ steps.build.outputs.digest }}

  deploy:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARCADE_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Deploy release through SSM
        env:
          INSTANCE_ID: ${{ vars.ARCADE_INSTANCE_ID }}
          IMAGE: ghcr.io/mynameis-nigel/ssh-farm@${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          jq -n \
            --arg script "$(base64 -w0 scripts/deploy/remote-deploy.sh)" \
            --arg image "$IMAGE" --arg version "$VERSION" \
            '{executionTimeout: ["1500"], commands: [
              "set -eu",
              "script=$(mktemp)",
              "trap \"rm -f $script\" EXIT",
              "printf %s \($script) | base64 -d > \"$script\"",
              "SERVICE=farm IMAGE=\($image) VERSION=\($version) sh \"$script\""
            ]}' > params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --comment "deploy farm $VERSION" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          # The standard waiter stops too early for a queued host deployment.
          for attempt in $(seq 1 170); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json | tee result.json
          {
            echo "Release: v$VERSION"
            echo "Image: $IMAGE"
            echo "SSM command: $command_id"
            echo "Status: $(jq -r .Status result.json)"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(jq -r .Status result.json)" = Success

version: 2

updates:
  # Go modules. The stack is pinned hard (charm.land v2, modernc sqlite) and
  # docs/README.md calls it "the locked stack", so these arrive weekly and
  # grouped — a pull request per patch bump on a nine-dependency tree is how
  # dependency updates become something people rubber-stamp.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "no-test-needed"]

  # GitHub Actions. This is the one that matters most for a repository that
  # publishes a public image: a compromised action runs inside the job that
  # holds packages:write and the OIDC deploy role.
  #
  # One pull request for the lot. Every merge to main is a production deploy
  # (release.yml), and ungrouped these arrived five at a time — all touching
  # ci.yml, so each merge rebased the rest and re-ran their CI — which made a
  # week of action bumps five farm restarts. The default limit of five open
  # pull requests also meant the rest of the queue waited behind them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "no-test-needed"]

  # The litestream build-only module. This used to be a docker `FROM` pin on
  # litestream/litestream, picked up by the docker entry below; litestream is
  # now built from source, so without this entry the pin — and every
  # transitive dependency compiled into the binary the image ships — would
  # silently stop being watched. Ungrouped on purpose: this tree is the one
  # the release scan fails on, so a bump here is a release unblocker and
  # wants to arrive as its own reviewable pull request.
  - package-ecosystem: gomod
    directory: /build/litestream
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "no-test-needed"]

  # The Dockerfile's base images: golang and alpine. An alpine patch release
  # is exactly the update that never gets noticed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A Go minor release is an upgrade to do on purpose, not a weekly bump.
      # CI's setup-go reads go.mod, so bumping only the builder here ships a
      # binary from a toolchain no test ever ran on. go.mod, both builder
      # stages and build/litestream/go.mod move together, by hand. Patch
      # releases, which carry the security fixes, still arrive here. Go 1.26
      # is supported until 1.28 ships (February 2027), and govulncheck turns
      # red on stdlib advisories if that date slips past unnoticed.
      - dependency-name: golang
        update-types: ["version-update:semver-minor"]
    labels: ["dependencies", "no-test-needed"]

# Local durability drill stack: ssh-farm wired to a MinIO container instead
# of real S3, using the same Dockerfile/entrypoint the fleet runs in
# production. Litestream uses MinIO's S3-compatible API. The test-only
# server/client images are built from pinned source, not pulled from MinIO.
#
# Usage: see run.sh in this directory.
services:
  minio:
    build:
      context: .
      target: minio
    command: server /data
    environment:
      MINIO_ROOT_USER: drilluser
      MINIO_ROOT_PASSWORD: drillpassword
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-setup:
    build:
      context: .
      target: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set drill http://minio:9000 drilluser drillpassword &&
      mc mb -p drill/ssharcade-drill
      "

  farm:
    build:
      context: ../..
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      FARM_LOG_FORMAT: text
      FARM_LOG_LEVEL: debug
      LITESTREAM_REPLICA_URL: s3://ssharcade-drill/farm/db
      LITESTREAM_S3_REGION: us-east-1
      LITESTREAM_S3_ENDPOINT: http://minio:9000
      LITESTREAM_ACCESS_KEY_ID: drilluser
      LITESTREAM_SECRET_ACCESS_KEY: drillpassword
      # litestream 0.5+ auto-detects a host:port endpoint as MinIO and
      # enables path-style addressing; no force-path-style flag needed.
      # No host-key vars here any more: the entrypoint seeds its host key from a
      # read-only host mount, not from the bucket, so FARM_HOST_KEY_MC_PATH and
      # MC_HOST_drill would be silently ignored. The drill exercises the DB
      # restore path, which is what its gate actually asserts; the container
      # generates a throwaway host key, which is correct for a drill.
    volumes:
      - farm-drill-data:/var/lib/farm
    ports:
      - "2222:2222"

volumes:
  farm-drill-data:

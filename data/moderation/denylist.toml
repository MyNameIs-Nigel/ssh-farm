# Farm-name moderation denylist (gameplay/03).
#
# Format (see internal/moderation/denylist.go):
#   [[term]]
#   word  = "..."        # normalized form: lowercase, ASCII
#   tier  = "slur" | "profanity"
#   match = "substring" | "word"
#
# - slur / substring: zero tolerance, matched anywhere in the normalized,
#   separator-stripped candidate (catches "s-l-u-r", "sl4ck3r"-style leet,
#   and embedding inside a longer name).
# - profanity / word: matched only as a whole separator-delimited token in
#   the folded (but not separator-stripped) name, so "CLASS ACT FARM" and
#   "GRASS VALLEY" are untouched by the embedded "ass" (the Scunthorpe
#   problem) — see `allow` below for the residual exceptions tests find.
#
# This is a starter set, deliberately short. Per docs/gameplay/03 and the
# operator runbook (docs/runbooks/moderation.md): seed the real list from an
# established open source (e.g. LDNOOBW's multi-language lists) and
# hand-review every addition — machine-copied lists carry false positives.
# Tightening this file is a data change, not a code change, and the
# render-time re-check (internal/leaderboard) makes it retroactive: a save
# in the middle of the board today is safe. Never copy this file's slur
# entries into public repos, commit messages, or test names (tests use
# placeholder tokens injected via a test-only list instead).

[[term]]
word = "fuck"
tier = "profanity"
match = "word"

[[term]]
word = "shit"
tier = "profanity"
match = "word"


# Exceptions: whole normalized (lowercase, separator-stripped) names that
# would otherwise trip a term above but are legitimate. Empty today because
# every term above is either whole-word (already Scunthorpe-safe by
# tokenization — see internal/moderation/normalize.go) or a slur substring
# with no known false positive yet; add entries here the moment a test or
# player report finds one. Never remove a denylist term to fix a false
# positive — allow-list the specific word instead, so the term keeps
# catching everything else.
allow = []
